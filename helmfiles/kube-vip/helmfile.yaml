---
helmDefaults:
  wait: true
  timeout: 300
repositories:
- name: incubator
  url: https://charts.helm.sh/incubator
releases:
- name: kube-vip
  namespace: kube-system
  chart: incubator/raw
  hooks:
    - events: ["prepare", "presync"]
      command: "kubectl"
      args:
        - "apply"
        - "-f"
        - "kube-vip.yaml"
